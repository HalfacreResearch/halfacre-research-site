<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Create your account</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f4f5;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 48px 20px 40px;
    }
    .brand {
      text-align: center;
      margin: 0 0 28px;
    }
    .brand p {
      margin: 0 0 8px;
      color: #666;
      font-size: 13px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 24px 22px 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    #googleBtn {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }
    .or {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #888;
      font-size: 12px;
    }
    .or:before, .or:after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e5e5;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: #222;
    }
    input {
      width: 100%;
      height: 44px;
      margin: 0 0 14px;
      padding: 0 12px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      color: #111;
    }
    input:focus {
      outline: none;
      border-color: #111;
    }
    .create {
      width: 100%;
      height: 44px;
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .create:hover { background: #000; }
    .create:disabled, .busy { opacity: 0.55; cursor: wait; }
    .err {
      min-height: 18px;
      margin: 0 0 8px;
      color: #b42318;
      font-size: 13px;
    }
    .fine {
      margin: 14px 0 0;
      color: #777;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    .back {
      display: block;
      margin: 18px auto 0;
      text-align: center;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <p>Halfacre Research</p>
      <h1>Create your account</h1>
    </div>

    <div class="card">
      <div id="googleBtn"></div>

      <div class="or">or</div>

      <form id="form">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required>

        <p class="err" id="err"></p>
        <button class="create" type="submit" id="create">Create account</button>
      </form>
    </div>

    <p class="fine">Free to create. After you finish, Grok meets you on your page. Google is optional — the form works if you do not use it.</p>
    <a class="back" href="admin.html">Back to desk</a>
  </div>

  <script>
    (function () {
      // Existing Web client already authorizes www. Apex is not on that client
      // and Cloud Console cannot add it without a signed-in session.
      if (location.hostname === "halfacreresearch.tech") {
        location.replace("https://www.halfacreresearch.tech" + location.pathname + location.search + location.hash);
        return;
      }

      var CLIENT_ID = "3260604131-hsdpbu9kmn06e449e193kqkuo9e8o9b8.apps.googleusercontent.com";
      var KEY = "halfacre.clients";
      var err = document.getElementById("err");
      var createBtn = document.getElementById("create");

      function showError(text) {
        err.textContent = text;
      }

      function load() {
        try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
        catch (e) { return []; }
      }

      function saveLocal(client) {
        var rows = load();
        var found = false;
        rows = rows.map(function (row) {
          if (row && row.email === client.email) {
            found = true;
            return client;
          }
          return row;
        });
        if (!found) rows.push(client);
        localStorage.setItem(KEY, JSON.stringify(rows));
        localStorage.setItem("halfacre.session", JSON.stringify(client));
      }

      function go() {
        window.location.href = "van.html";
      }

      function createAccount(body) {
        showError("");
        createBtn.disabled = true;
        return fetch("signup.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function (pack) {
            if (!pack.ok || !pack.data || !pack.data.client) {
              throw new Error((pack.data && pack.data.error) || "Could not create the account.");
            }
            saveLocal(pack.data.client);
            go();
          })
          .catch(function (e) {
            showError(e.message || "Could not create the account.");
            createBtn.disabled = false;
          });
      }

      function handleGoogle(response) {
        if (!response || !response.credential) {
          showError("Google did not return a sign-in.");
          return;
        }
        createAccount({ google_id_token: response.credential });
      }

      function startGoogle() {
        if (!window.google || !google.accounts || !google.accounts.id) {
          return false;
        }
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleGoogle,
          ux_mode: "popup",
          auto_select: false,
          cancel_on_tap_outside: true
        });
        google.accounts.id.renderButton(document.getElementById("googleBtn"), {
          type: "standard",
          theme: "outline",
          size: "large",
          text: "continue_with",
          shape: "rectangular",
          logo_alignment: "left",
          width: 360
        });
        return true;
      }

      if (!startGoogle()) {
        window.addEventListener("load", startGoogle);
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (startGoogle() || tries > 40) clearInterval(timer);
        }, 250);
      }

      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        createAccount({
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim()
        });
      });
    })();
  </script>
</body>
</html>
