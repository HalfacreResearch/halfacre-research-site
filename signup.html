<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Create account</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --card: #161616;
      --line: #2a2a2a;
      --orange: #F7931A;
      --white: #FFFFFF;
      --muted: #9a9a9a;
      --btn: #39FF14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }
    header { padding: 22px 18px 8px; }
    header p {
      margin: 0;
      color: var(--orange);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 8px 0 6px; font-size: 30px; }
    .sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .wrap { padding: 16px; max-width: 480px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--orange);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }
    input {
      width: 100%;
      background: #101010;
      color: var(--white);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin: 0 0 12px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--btn);
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 0;
      margin: 0 0 10px;
    }
    .ghost {
      background: transparent;
      color: var(--white);
      border: 1px solid #444;
    }
    .err { color: #ff8a8a; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <header>
    <p>Halfacre Research</p>
    <h1>Create account</h1>
    <p class="sub">Free. Same page for every client. Name, email, phone. Then your Grok page.</p>
  </header>

  <div class="wrap">
    <section class="card">
      <button class="btn" type="button" id="google">Continue with Google</button>
      <p class="sub" style="margin:0 0 14px">If you have Gmail, use that. If you don’t, fill the boxes and we email you a button later.</p>
      <form id="form">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        <p class="err" id="err"></p>
        <button class="btn" type="submit">Create account</button>
      </form>
    </section>
    <a class="btn ghost" href="admin.html">Back to desk</a>
  </div>

  <script>
    (function () {
      var KEY = "halfacre.clients";
      function load() {
        try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
        catch (e) { return []; }
      }
      function save(rows) {
        localStorage.setItem(KEY, JSON.stringify(rows));
      }
      function go(client) {
        localStorage.setItem("halfacre.session", JSON.stringify(client));
        window.location.href = "van.html";
      }
      document.getElementById("google").onclick = function () {
        document.getElementById("err").textContent =
          "Google sign-in turns on when this page is on the live site. For this practice, fill the three boxes.";
      };
      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        var client = {
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          created: new Date().toISOString()
        };
        if (!client.name || !client.email || !client.phone) {
          document.getElementById("err").textContent = "Need name, email, and phone.";
          return;
        }
        var rows = load();
        rows.push(client);
        save(rows);
        go(client);
      });
    })();
  </script>
</body>
</html>
