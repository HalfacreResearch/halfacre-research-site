<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Create your account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f4f5;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 48px 20px 40px;
    }
    .brand {
      text-align: center;
      margin: 0 0 28px;
    }
    .brand p {
      margin: 0 0 8px;
      color: #666;
      font-size: 13px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 24px 22px 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 44px;
      background: #fff;
      color: #1f1f1f;
      border: 1px solid #747775;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    .google:hover { background: #f7f8f8; }
    .google svg { width: 18px; height: 18px; flex: 0 0 18px; }
    .or {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #888;
      font-size: 12px;
    }
    .or:before, .or:after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e5e5e5;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: #222;
    }
    input {
      width: 100%;
      height: 44px;
      margin: 0 0 14px;
      padding: 0 12px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      color: #111;
    }
    input:focus {
      outline: none;
      border-color: #111;
    }
    .create {
      width: 100%;
      height: 44px;
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .create:hover { background: #000; }
    .err {
      min-height: 18px;
      margin: 0 0 8px;
      color: #b42318;
      font-size: 13px;
    }
    .fine {
      margin: 14px 0 0;
      color: #777;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    .back {
      display: block;
      margin: 18px auto 0;
      text-align: center;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <p>Halfacre Research</p>
      <h1>Create your account</h1>
    </div>

    <div class="card">
      <button class="google" type="button" id="google">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <div class="or">or</div>

      <form id="form">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required>

        <p class="err" id="err"></p>
        <button class="create" type="submit">Create account</button>
      </form>
    </div>

    <p class="fine">Free to create. If you don’t use Google, we’ll email you a sign-in button after this.</p>
    <a class="back" href="admin.html">Back to desk</a>
  </div>

  <script>
    (function () {
      var KEY = "halfacre.clients";
      function load() {
        try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
        catch (e) { return []; }
      }
      function save(rows) {
        localStorage.setItem(KEY, JSON.stringify(rows));
      }
      function go(client) {
        localStorage.setItem("halfacre.session", JSON.stringify(client));
        window.location.href = "van.html";
      }
      document.getElementById("google").onclick = function () {
        document.getElementById("err").textContent =
          "Google sign-in turns on when this is on the live site. Use the form below for this practice.";
      };
      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        var client = {
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          created: new Date().toISOString()
        };
        if (!client.name || !client.email || !client.phone) {
          document.getElementById("err").textContent = "Name, email, and phone are required.";
          return;
        }
        var rows = load();
        rows.push(client);
        save(rows);
        go(client);
      });
    })();
  </script>
</body>
</html>
