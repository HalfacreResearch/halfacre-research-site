<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Company desk</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --card: #161616;
      --line: #2a2a2a;
      --orange: #F7931A;
      --white: #FFFFFF;
      --muted: #9a9a9a;
      --btn: #39FF14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }
    header { padding: 22px 18px 8px; }
    header p {
      margin: 0;
      color: var(--orange);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 8px 0 0; font-size: 34px; }
    .grid {
      display: grid;
      gap: 12px;
      padding: 16px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; max-width: 820px; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px 16px;
      min-height: 150px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange);
    }
    .who { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .meta { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .btn {
      display: inline-block;
      background: var(--btn);
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      margin: 0 8px 8px 0;
    }
    .btn.ghost {
      background: transparent;
      color: var(--white);
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <header>
    <p>Matthew</p>
    <h1>Desk</h1>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Clients</h2>
      <p class="who">Charley Van Halfacre</p>
      <p class="meta">Client 1 · not live yet</p>
      <a class="btn" href="van.html">Open his page</a>
    </section>

    <section class="card">
      <h2>Staff</h2>
      <p class="who">You + the bots</p>
      <p class="meta">Fleet is quiet this week</p>
      <a class="btn ghost" href="#staff">See staff</a>
    </section>

    <section class="card">
      <h2>Workspace</h2>
      <p class="who">Google</p>
      <p class="meta">Files, mail, calendar</p>
      <a class="btn" href="https://drive.google.com">Drive</a>
      <a class="btn" href="https://mail.google.com">Gmail</a>
      <a class="btn" href="https://calendar.google.com">Calendar</a>
    </section>

    <section class="card">
      <h2>Site</h2>
      <p class="who">Practice only</p>
      <p class="meta">Not on the live website</p>
      <a class="btn ghost" href="pages.html">Old pages</a>
    </section>
  </div>
</body>
</html>
