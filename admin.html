<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Company desk</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --card: #161616;
      --line: #2a2a2a;
      --orange: #F7931A;
      --white: #FFFFFF;
      --muted: #9a9a9a;
      --btn: #39FF14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }
    header { padding: 22px 18px 8px; }
    header p {
      margin: 0;
      color: var(--orange);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 8px 0 0; font-size: 34px; }
    .grid {
      display: grid;
      gap: 12px;
      padding: 16px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; max-width: 820px; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px 16px;
      min-height: 150px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange);
    }
    .who { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .meta { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .btn {
      display: inline-block;
      background: var(--btn);
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      margin: 0 8px 8px 0;
    }
    .btn.ghost {
      background: transparent;
      color: var(--white);
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <header>
    <p>Matthew</p>
    <h1>Desk</h1>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Clients</h2>
      <p class="who" id="clientName">Charley Van Halfacre</p>
      <p class="meta" id="clientMeta">Client 1 · Grok coach on his page</p>
      <a class="btn" href="van.html">Open his page</a>
      <a class="btn ghost" href="signup.html">Create account</a>
    </section>

    <section class="card">
      <h2>Staff</h2>
      <p class="who">You + the bots</p>
      <p class="meta">Fleet is quiet this week</p>
      <a class="btn ghost" href="#staff">See staff</a>
    </section>

    <section class="card">
      <h2>Workspace</h2>
      <p class="who">Google</p>
      <p class="meta">Files, mail, calendar</p>
      <a class="btn" href="https://drive.google.com">Drive</a>
      <a class="btn" href="https://mail.google.com">Gmail</a>
      <a class="btn" href="https://calendar.google.com">Calendar</a>
    </section>

    <section class="card">
      <h2>Site</h2>
      <p class="who">Signup is live</p>
      <p class="meta">Not the public homepage</p>
      <a class="btn ghost" href="pages.html">Old pages</a>
    </section>
  </div>
  <script>
    (function () {
      try {
        var rows = JSON.parse(localStorage.getItem("halfacre.clients") || "[]");
        var last = rows[rows.length - 1];
        if (last && last.name) {
          document.getElementById("clientName").textContent = last.name;
          document.getElementById("clientMeta").textContent =
            (last.email || "") + " \u00b7 " + (last.phone || "") + " \u00b7 practice";
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
