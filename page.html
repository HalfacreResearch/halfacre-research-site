<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Your page</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="stylesheet" href="client-desk.css?v=1">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p id="who">Your page</p>
        <h1 id="name">Loading…</h1>
        <p class="sub">Halfacre Research · your page</p>
      </div>
      <nav class="nav" aria-label="Page">
        <a href="#talk" data-desk="talk">Talk</a>
        <a href="#uploaded" data-desk="uploaded">Uploaded <span id="navUploadsCount">0</span></a>
        <a href="#purchased" data-desk="purchased">Purchased <span id="navBuysCount">0</span></a>
      </nav>
      <button class="nav-toggle" id="navToggle" type="button">Menu</button>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <h2 id="sideUploads">Uploaded</h2>
        <div id="deskUploads"></div>
        <h2 id="sideBuys">Purchased</h2>
        <div id="deskBuys"></div>
      </aside>

      <main class="main" id="app" hidden>
        <section class="card" id="talk">
          <h2>Grok</h2>
          <div id="log"></div>
          <div class="chips" id="chips"></div>
          <form class="talk" id="form">
            <input id="line" type="text" autocomplete="off" placeholder="Talk to Grok">
            <button class="send" type="submit">Send</button>
          </form>
        </section>

        <section class="card">
          <h2>Upload</h2>
          <p class="sub" style="margin:0 0 12px">Bank, brokerage, exchange, or the last two years of tax returns.</p>
          <label class="btn file">
            Add a statement
            <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.csv,.txt" hidden>
          </label>
        </section>

        <p><a class="btn ghost" href="admin.html">Back to desk</a></p>
      </main>
    </div>
  </div>
  <p class="empty" id="wait">Opening your page…</p>

  <script src="pay-catalog.js?v=1"></script>
  <script src="van-grok.js?v=4"></script>
  <script src="client-desk.js?v=1"></script>
  <script>
    (function () {
      if (location.hostname === "halfacreresearch.tech") {
        location.replace("https://www.halfacreresearch.tech" + location.pathname + location.search + location.hash);
        return;
      }

      var wait = document.getElementById("wait");
      var app = document.getElementById("app");

      function sessionClient() {
        try { return JSON.parse(localStorage.getItem("halfacre.session") || "null"); }
        catch (e) { return null; }
      }

      function apply(client) {
        if (!client || !client.name) {
          wait.textContent = "We could not open that page. Create your account first.";
          return;
        }
        window.HalfacreClient = client;
        document.title = client.name;
        document.getElementById("who").textContent = client.number
          ? "Client " + client.number
          : "Your page";
        document.getElementById("name").textContent = client.name;
        wait.hidden = true;
        app.hidden = false;
        var ready = window.HalfacreDesk
          ? window.HalfacreDesk.mount({ id: client.id, name: client.name })
          : Promise.resolve();
        Promise.resolve(ready).finally(function () {
          startChat(client);
        });
      }

      function startChat(client) {
        var grok = window.HalfacreGrok;
        var log = document.getElementById("log");
        var form = document.getElementById("form");
        var line = document.getElementById("line");
        var chips = document.getElementById("chips");
        var file = document.getElementById("file");
        var sendBtn = form.querySelector(".send");
        var history = [];

        function bubble(text, mine) {
          var el = document.createElement("div");
          el.className = mine ? "msg me" : "msg";
          el.textContent = text;
          log.appendChild(el);
          el.scrollIntoView({ block: "end" });
        }

        function talk(text, silent) {
          if (!text) return;
          if (!silent) bubble(text, true);
          history.push({ role: "user", content: text });
          sendBtn.disabled = true;
          var work = grok && grok.reply
            ? grok.reply(text, null, history)
            : Promise.resolve("");
          Promise.resolve(work).then(function (reply) {
            var out = String(reply || "").trim();
            if (!out || (grok && grok.isOfflineNote && grok.isOfflineNote(out))) {
              throw new Error("offline");
            }
            bubble(out, false);
            history.push({ role: "assistant", content: out });
          }).catch(function () {
            bubble("Grok is not connected on this page right now.", false);
          }).finally(function () {
            sendBtn.disabled = false;
          });
        }

        if (grok && grok.starters) {
          grok.starters.forEach(function (row) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "chip";
            b.textContent = row.label;
            b.onclick = function () { talk(row.send); };
            chips.appendChild(b);
          });
        }

        (function openGrok() {
          sendBtn.disabled = true;
          var work = grok && grok.open
            ? grok.open()
            : Promise.reject(new Error("offline"));
          Promise.resolve(work).then(function (reply) {
            var out = String(reply || "").trim();
            if (!out) throw new Error("offline");
            bubble(out, false);
            history.push({ role: "assistant", content: out });
          }).catch(function () {
            bubble("Grok is not connected on this page right now.", false);
          }).finally(function () {
            sendBtn.disabled = false;
          });
        })();

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var text = line.value.trim();
          line.value = "";
          talk(text);
        });

        file.addEventListener("change", function () {
          var picked = file.files && file.files[0];
          if (!picked) return;
          var desk = window.HalfacreDesk;
          if (desk && desk.recordUpload) {
            desk.recordUpload(picked.name, desk.kindFromName(picked.name));
          }
          var reader = new FileReader();
          reader.onload = function () {
            var raw = String(reader.result || "");
            var clip = raw.length > 12000 ? raw.slice(0, 12000) + "\n[truncated]" : raw;
            talk("I uploaded " + picked.name + ".\n\n" + clip);
          };
          if (/\.pdf$/i.test(picked.name)) {
            talk("I uploaded a PDF named " + picked.name + ".");
          } else {
            reader.readAsText(picked);
          }
          file.value = "";
        });
      }

      var id = new URLSearchParams(location.search).get("c") || "";
      var local = sessionClient();

      if (!id && local && local.id) {
        location.replace("page.html?c=" + encodeURIComponent(local.id));
        return;
      }
      if (!id) {
        location.replace("signup.html");
        return;
      }

      fetch("client.php?c=" + encodeURIComponent(id))
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (pack) {
          if (pack.ok && pack.data && pack.data.client && pack.data.client.name) {
            apply(pack.data.client);
            return;
          }
          if (local && local.id === id && local.name) {
            apply(local);
            return;
          }
          wait.textContent = (pack.data && pack.data.error) || "No page for that account.";
        })
        .catch(function () {
          if (local && local.id === id && local.name) {
            apply(local);
            return;
          }
          wait.textContent = "Could not open your page. Try creating the account again.";
        });
    })();
  </script>
</body>
</html>
