<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Charley Van Halfacre</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="stylesheet" href="client-desk.css?v=1">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p>Client 1</p>
        <h1>Charley Van Halfacre</h1>
        <p class="sub">Halfacre Research · your page</p>
      </div>
      <nav class="nav" aria-label="Page">
        <a href="#talk" data-desk="talk">Talk</a>
        <a href="#uploaded" data-desk="uploaded">Uploaded <span id="navUploadsCount">0</span></a>
        <a href="#purchased" data-desk="purchased">Purchased <span id="navBuysCount">0</span></a>
      </nav>
      <button class="nav-toggle" id="navToggle" type="button">Menu</button>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <h2 id="sideUploads">Uploaded</h2>
        <div id="deskUploads"></div>
        <h2 id="sideBuys">Purchased</h2>
        <div id="deskBuys"></div>
      </aside>

      <main class="main">
        <section class="card" id="talk">
          <h2>Grok</h2>
          <div id="log"></div>
          <div class="chips" id="chips"></div>
          <form class="talk" id="form">
            <input id="line" type="text" autocomplete="off" placeholder="Talk to Grok">
            <button class="send" type="submit">Send</button>
          </form>
        </section>

        <section class="card">
          <h2>Upload</h2>
          <p class="sub" style="margin:0 0 12px">Bank, brokerage, exchange, or the last two years of tax returns.</p>
          <label class="btn file">
            Add a statement
            <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.csv,.txt" hidden>
          </label>
        </section>

        <p><a class="btn ghost" href="admin.html">Back to desk</a></p>
      </main>
    </div>
  </div>

  <script src="pay-catalog.js?v=1"></script>
  <script src="van-owned.js?v=1"></script>
  <script src="van-grok.js?v=4"></script>
  <script src="client-desk.js?v=1"></script>
  <script>
    (function () {
      window.HalfacreClient = {
        id: "charley-van-halfacre",
        name: "Charley Van Halfacre",
        number: 1
      };

      var grok = window.HalfacreGrok;
      var log = document.getElementById("log");
      var form = document.getElementById("form");
      var line = document.getElementById("line");
      var chips = document.getElementById("chips");
      var file = document.getElementById("file");
      var sendBtn = form.querySelector(".send");
      var history = [];

      if (window.HalfacrePay && window.HalfacrePay.load) {
        window.HalfacrePay.load().then(function () {
          if (window.VanOwned && window.VanOwned.load) {
            return window.VanOwned.load();
          }
        }).then(function () {
          if (window.HalfacreDesk) window.HalfacreDesk.refresh();
        }).catch(function () {
          if (window.HalfacreDesk) window.HalfacreDesk.refresh();
        });
      }

      var deskReady = window.HalfacreDesk
        ? window.HalfacreDesk.mount({
            id: "charley-van-halfacre",
            name: "Charley Van Halfacre"
          })
        : Promise.resolve();

      function bubble(text, mine) {
        var el = document.createElement("div");
        el.className = mine ? "msg me" : "msg";
        el.textContent = text;
        log.appendChild(el);
        el.scrollIntoView({ block: "end" });
      }

      function talk(text, silent) {
        if (!text) return;
        if (!silent) bubble(text, true);
        history.push({ role: "user", content: text });
        sendBtn.disabled = true;
        var work = grok && grok.reply
          ? grok.reply(text, null, history)
          : Promise.resolve("");
        Promise.resolve(work).then(function (reply) {
          var out = String(reply || "").trim();
          if (!out || (grok && grok.isOfflineNote && grok.isOfflineNote(out))) {
            throw new Error("offline");
          }
          bubble(out, false);
          history.push({ role: "assistant", content: out });
        }).catch(function () {
          bubble("Grok is not connected on this page right now.", false);
        }).finally(function () {
          sendBtn.disabled = false;
        });
      }

      if (grok && grok.starters) {
        grok.starters.forEach(function (row) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = row.label;
          b.onclick = function () { talk(row.send); };
          chips.appendChild(b);
        });
      }

      function openGrok() {
        sendBtn.disabled = true;
        var work = grok && grok.open
          ? grok.open()
          : Promise.reject(new Error("offline"));
        Promise.resolve(work).then(function (reply) {
          var out = String(reply || "").trim();
          if (!out) throw new Error("offline");
          bubble(out, false);
          history.push({ role: "assistant", content: out });
        }).catch(function () {
          bubble("Grok is not connected on this page right now.", false);
        }).finally(function () {
          sendBtn.disabled = false;
        });
      }

      Promise.resolve(deskReady).finally(function () {
        openGrok();
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = line.value.trim();
        line.value = "";
        talk(text);
      });

      file.addEventListener("change", function () {
        var picked = file.files && file.files[0];
        if (!picked) return;
        var desk = window.HalfacreDesk;
        if (desk && desk.recordUpload) {
          desk.recordUpload(picked.name, desk.kindFromName(picked.name));
        }
        var reader = new FileReader();
        reader.onload = function () {
          var raw = String(reader.result || "");
          var clip = raw.length > 12000 ? raw.slice(0, 12000) + "\n[truncated]" : raw;
          talk("I uploaded " + picked.name + ".\n\n" + clip);
        };
        if (/\.pdf$/i.test(picked.name)) {
          talk("I uploaded a PDF named " + picked.name + ".");
        } else {
          reader.readAsText(picked);
        }
        file.value = "";
      });
    })();
  </script>
</body>
</html>
