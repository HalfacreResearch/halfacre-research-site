<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Charlie Van Halfacre</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --card: #161616;
      --line: #2a2a2a;
      --orange: #F7931A;
      --white: #FFFFFF;
      --muted: #9a9a9a;
      --btn: #39FF14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }
    header { padding: 22px 18px 8px; }
    header p {
      margin: 0;
      color: var(--orange);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 8px 0 4px; font-size: 30px; }
    .sub { margin: 0; color: var(--muted); font-size: 14px; }
    .wrap { padding: 16px; max-width: 560px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin: 0 0 12px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--orange);
    }
    .msg {
      background: #101010;
      border-radius: 12px;
      padding: 12px 14px;
      line-height: 1.45;
      font-size: 15px;
      margin: 0 0 12px;
    }
    .btn, .file {
      display: inline-block;
      background: var(--btn);
      color: #111;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 0;
      margin: 0 8px 8px 0;
    }
    .file { cursor: pointer; }
    .ghost {
      background: transparent;
      color: var(--white);
      border: 1px solid #444;
    }
    form {
      display: flex;
      gap: 8px;
      margin: 0;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #101010;
      color: var(--white);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
    }
    button.send {
      background: var(--btn);
      color: #111;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      padding: 0 16px;
    }
    #log { min-height: 80px; }
  </style>
</head>
<body>
  <header>
    <p>Client 1</p>
    <h1>Charlie Van Halfacre</h1>
    <p class="sub">Dad’s page · not the company desk</p>
  </header>

  <div class="wrap">
    <section class="card">
      <h2>Dad</h2>
      <div id="log">
        <div class="msg">Two pictures: starting at zero, and the best retirement structure there is. Upload a statement and I’ll put you on the line between them.</div>
      </div>
      <form id="form">
        <input id="line" type="text" autocomplete="off" placeholder="Talk to Dad">
        <button class="send" type="submit">Send</button>
      </form>
    </section>

    <section class="card">
      <h2>Upload</h2>
      <p class="sub" style="margin:0 0 12px">Bank, brokerage, or tax form. That’s how the plan starts.</p>
      <label class="btn file">
        Add a statement
        <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.csv" hidden>
      </label>
    </section>

    <p><a class="btn ghost" href="admin.html">Back to desk</a></p>
  </div>

  <script src="van-grok.js"></script>
</body>
</html>
